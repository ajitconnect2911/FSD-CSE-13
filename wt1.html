<!DOCTYPE html>
<html>
<head>
  <title>Three Divs Inline</title>
  <style>
    .container {
      display: flex;     }
    .box {
      width: 100px;
      height: 100px;
      margin: 10px;
      background-color: lightblue;
      text-align: center;
      line-height: 100px;
      border: 2px solid navy;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="box">Box 1</div>
    <div class="box">Box 2</div>
    <div class="box">Box 3</div>
  </div>
</body>
</html>
